from abbreviation_kg_manager import AbbreviationKnowledgeGraphManager
# Remove this line - it's wrong: from abbreviation_kg_manager import AbbreviationKn

# Initialize the knowledge graph manager
# First time - no existing knowledge graph
kg_manager = AbbreviationKnowledgeGraphManager(
    ontology_path="AerospaceAbbreviationFull-formOntology.ttl",  # Your ontology file
    knowledge_graph_path=None      # No existing KG yet
)

# Process your CSV file
kg_manager.process_csv(
    csv_file_path="acro.csv",
    source_name="pwww_site",
    use_random_ids=False  # Use deterministic IDs
)

# Save the knowledge graph
kg_manager.save_knowledge_graph("aerospace_kg.ttl")

# Print statistics
stats = kg_manager.get_statistics()
print("\n=== Knowledge Graph Statistics ===")
for key, value in stats.items():
    print(f"{key}: {value}")

# Test a query
print("\n=== Testing Query ===")
results = kg_manager.query_abbreviation("TEC")
for result in results:
    print(f"TEC expands to: {result[0]}")
