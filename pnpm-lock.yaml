# --- Find the most frequently occurring columns across all tables ---

# This query does three things:
# 1. Groups by column_name to analyze each column.
# 2. Counts the number of tables each column appears in (table_count).
# 3. Aggregates the names of those tables into a list (tables).
# 4. Orders the results to show the most common columns first.

common_columns_query = """
SELECT
    column_name,
    COUNT(DISTINCT table_name) AS table_count,
    LIST(DISTINCT table_name) AS tables
FROM
    information_schema.columns
WHERE
    table_schema = 'HAMR'
GROUP BY
    column_name
ORDER BY
    table_count DESC;
"""

print("--- Finding the most common columns across all tables ---")
common_columns_df = analyzer.analyze(common_columns_query)


# --- Now, process and display the top results ---

if common_columns_df is not None and not common_columns_df.empty:

    # Determine how many top results to show (e.g., top 2)
    top_n = 2
    
    print(f"\n--- Top {top_n} Most Common Columns ---")

    # Loop through the top N rows of the result DataFrame
    for index, row in common_columns_df.head(top_n).iterrows():
        rank = index + 1
        column = row['column_name']
        count = row['table_count']
        table_list = row['tables']

        print(f"\n#{rank}: Column '{column}' (Found in {count} tables)")
        print("   • Tables:")
        for table in table_list:
            print(f"     - {table}")

else:
    print("\nCould not analyze column frequency.")
